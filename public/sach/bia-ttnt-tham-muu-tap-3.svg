<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img"
     aria-label="Bìa sách Trí tuệ nhân tạo trong công tác tham mưu — Tập 3: Từ ứng dụng đến dữ liệu — Hà Ngọc Sơn">
  <title>Trí tuệ nhân tạo trong công tác tham mưu — Tập 3 — Hà Ngọc Sơn</title>
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#f1e8d6"/>
    </linearGradient>
    <linearGradient id="do" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#nen)"/>
  <!-- Dải đỏ bên trái (gáy) -->
  <rect x="0" y="0" width="34" height="900" fill="url(#do)"/>
  <rect x="34" y="0" width="4" height="900" fill="#d4a017"/>

  <!-- Đường mạch điện tử góc phải -->
  <g fill="none" stroke="#1e3a8a" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round">
    <path d="M600 470 H520 L490 500 V600"/>
    <path d="M600 520 H545 L515 550 V640"/>
    <path d="M600 570 H565 L540 595 V690"/>
    <path d="M600 420 H500 L460 460 V520"/>
  </g>
  <g fill="#1e3a8a" fill-opacity="0.3">
    <circle cx="490" cy="600" r="6"/><circle cx="515" cy="640" r="6"/>
    <circle cx="540" cy="690" r="6"/><circle cx="460" cy="520" r="6"/>
  </g>

  <g font-family="'Times New Roman', 'Noto Serif', Georgia, serif" text-anchor="start">
    <text x="70" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#b91c1c">SÁCH CHUYÊN KHẢO · BẢN THẢO THÁNG 11-2026</text>
    <rect x="70" y="108" width="90" height="3" fill="#d4a017"/>

    <text x="70" y="178" font-size="38" font-weight="700" fill="#1e2a5a">TRÍ TUỆ NHÂN TẠO</text>
    <text x="70" y="222" font-size="27" font-weight="700" fill="#1e2a5a">TRONG CÔNG TÁC THAM MƯU</text>

    <rect x="70" y="252" width="118" height="46" rx="4" fill="#b91c1c"/>
    <text x="129" y="285" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">TẬP 3</text>

    <text x="70" y="370" font-size="44" font-weight="700" fill="#b91c1c">TỪ ỨNG DỤNG</text>
    <text x="70" y="424" font-size="44" font-weight="700" fill="#b91c1c">ĐẾN DỮ LIỆU</text>

    <text x="70" y="476" font-size="17" font-style="italic" fill="#334155">Phương pháp và chiến lược dữ liệu tập trung,</text>
    <text x="70" y="500" font-size="17" font-style="italic" fill="#334155">thống nhất, dùng chung trong hệ thống</text>
    <text x="70" y="524" font-size="17" font-style="italic" fill="#334155">chính trị cấp tỉnh</text>
  </g>

  <!-- Ba nguồn dữ liệu ở lại tại chỗ, nối về một cửa chia sẻ: "ba tập trung, một tại nguồn" -->
  <g transform="translate(250 580)">
    <g stroke="#1e2a5a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M40 60 V110 H150 V140"/><path d="M150 60 V140"/><path d="M260 60 V110 H150"/>
    </g>
    <g fill="#1e2a5a">
      <g id="tru"><ellipse cx="40" cy="6" rx="34" ry="11"/><path d="M6 6 V50 A34 11 0 0 0 74 50 V6 A34 11 0 0 1 6 6 Z"/></g>
      <use href="#tru" x="110"/><use href="#tru" x="220"/>
    </g>
    <g fill="none" stroke="#fbf7ee" stroke-width="2">
      <path d="M6 26 A34 11 0 0 0 74 26"/><path d="M116 26 A34 11 0 0 0 184 26"/><path d="M226 26 A34 11 0 0 0 294 26"/>
    </g>
    <rect x="105" y="140" width="90" height="46" rx="6" fill="#b91c1c"/>
    <circle cx="150" cy="163" r="9" fill="#d4a017"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="806" width="60" height="2" fill="#d4a017"/>
    <text x="70" y="838" font-size="20" font-weight="700" letter-spacing="2" fill="#1e2a5a">TS. HÀ NGỌC SƠN</text>
    <text x="70" y="864" font-size="13" letter-spacing="2" fill="#64748b">THANH HÓA · 2026</text>
  </g>
</svg>
