<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img"
     aria-label="Bìa sách Trí tuệ nhân tạo trong công tác tham mưu — Tập 2: Từ người dùng đến người kiến tạo — Hà Ngọc Sơn">
  <title>Trí tuệ nhân tạo trong công tác tham mưu — Tập 2 — Hà Ngọc Sơn</title>
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#f1e8d6"/>
    </linearGradient>
    <linearGradient id="do" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#nen)"/>
  <!-- Dải đỏ bên trái (gáy) -->
  <rect x="0" y="0" width="34" height="900" fill="url(#do)"/>
  <rect x="34" y="0" width="4" height="900" fill="#d4a017"/>

  <!-- Đường mạch điện tử góc phải -->
  <g fill="none" stroke="#1e3a8a" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round">
    <path d="M600 470 H520 L490 500 V600"/>
    <path d="M600 520 H545 L515 550 V640"/>
    <path d="M600 570 H565 L540 595 V690"/>
    <path d="M600 420 H500 L460 460 V520"/>
  </g>
  <g fill="#1e3a8a" fill-opacity="0.3">
    <circle cx="490" cy="600" r="6"/><circle cx="515" cy="640" r="6"/>
    <circle cx="540" cy="690" r="6"/><circle cx="460" cy="520" r="6"/>
  </g>

  <g font-family="'Times New Roman', 'Noto Serif', Georgia, serif" text-anchor="start">
    <text x="70" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#b91c1c">CẨM NANG THỰC HÀNH DÀNH CHO CÁN BỘ THAM MƯU</text>
    <rect x="70" y="108" width="90" height="3" fill="#d4a017"/>

    <text x="70" y="178" font-size="38" font-weight="700" fill="#1e2a5a">TRÍ TUỆ NHÂN TẠO</text>
    <text x="70" y="222" font-size="27" font-weight="700" fill="#1e2a5a">TRONG CÔNG TÁC THAM MƯU</text>

    <rect x="70" y="252" width="118" height="46" rx="4" fill="#b91c1c"/>
    <text x="129" y="285" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">TẬP 2</text>

    <text x="70" y="370" font-size="44" font-weight="700" fill="#b91c1c">TỪ NGƯỜI DÙNG</text>
    <text x="70" y="424" font-size="44" font-weight="700" fill="#b91c1c">ĐẾN NGƯỜI</text>
    <text x="70" y="478" font-size="44" font-weight="700" fill="#b91c1c">KIẾN TẠO</text>

    <text x="70" y="530" font-size="17" font-style="italic" fill="#334155">Cùng AI xây dựng ứng dụng và đổi mới</text>
    <text x="70" y="554" font-size="17" font-style="italic" fill="#334155">cách làm việc tại cơ quan dân cử</text>
  </g>

  <!-- Ngòi bút + ký hiệu mã nguồn: người cán bộ tham mưu kiến tạo công cụ -->
  <g transform="translate(300 600)">
    <path d="M60 0 L110 0 L120 150 L85 205 L50 150 Z" fill="#1e2a5a"/>
    <path d="M85 150 L85 205" stroke="#fbf7ee" stroke-width="3"/>
    <circle cx="85" cy="140" r="9" fill="#fbf7ee"/>
    <rect x="55" y="-26" width="60" height="26" rx="3" fill="#b91c1c"/>
    <text x="-30" y="95" font-family="'Courier New', monospace" font-size="46" font-weight="700" fill="#d4a017">&lt;/&gt;</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="806" width="60" height="2" fill="#d4a017"/>
    <text x="70" y="838" font-size="20" font-weight="700" letter-spacing="2" fill="#1e2a5a">TS. HÀ NGỌC SƠN</text>
    <text x="70" y="864" font-size="13" letter-spacing="2" fill="#64748b">THANH HÓA · 2026</text>
  </g>
</svg>
